<style>
/* Layout : app mobile à une colonne, en-tête collant, barre d'onglets fixe en bas ; tons fonte et laiton. */
:root{
  --bg:#101214; --surface:#191c1f; --surface2:#22262a; --line:#2d3237; --fg:#ecebe6; --muted:#979da3;

  --r:14px; --r-s:9px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eff1f2; --surface:#ffffff; --surface2:#e7eaec; --line:#d5d9dc; --fg:#15181a; --muted:#5b636a;
  --accent:#a46d14; --accent-soft:rgba(164,109,20,.12); --on-accent:#ffffff;
  --good:#2b8653; --good-soft:rgba(43,134,83,.12); --warn:#bf5718; --warn-soft:rgba(191,87,24,.12); --bad:#c13a3a; --bad-soft:rgba(193,58,58,.12);
  --scrim:rgba(20,24,28,.4); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eff1f2; --surface:#ffffff; --surface2:#e7eaec; --line:#d5d9dc; --fg:#15181a; --muted:#5b636a;
  --accent:#a46d14; --accent-soft:rgba(164,109,20,.12); --on-accent:#ffffff;
  --good:#2b8653; --good-soft:rgba(43,134,83,.12); --warn:#bf5718; --warn-soft:rgba(191,87,24,.12); --bad:#c13a3a; --bad-soft:rgba(193,58,58,.12);
  --scrim:rgba(20,24,28,.4); color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

.trajet{margin:4px 0 0;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.inp{appearance:none;width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}

.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}

.day{appearance:none;flex:none;width:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:1px}

.macros{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}

.up{color:var(--warn)} .down{color:var(--good)}
.body-grid{display:grid;grid-template-columns:1fr minmax(72px,.85fr) 1fr;gap:8px}
.mcard{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:0;min-width:0;color:var(--fg)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{appearance:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.02em}

.tab[aria-current="page"]{color:var(--accent)}

.sheet-bg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);text-align:center}

<script>
(function(){
"use strict";

/* ---------- utilitaires ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const monthOf = s => s.slice(0,7);
const addMonths = (m,n) => { const [y,mo] = m.split("-").map(Number); const d = new Date(y,mo-1+n,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); };
const mondayOf = s => { const d = parseYmd(s); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return ymd(d); };
const dow = s => parseYmd(s).getDay();
const fmt = (s,o) => new Intl.DateTimeFormat("fr-CH",o).format(parseYmd(s));
const fDay = s => fmt(s,{weekday:"long",day:"numeric",month:"long"});
const fShort = s => fmt(s,{day:"numeric",month:"short"});
const fMonth = m => new Intl.DateTimeFormat("fr-CH",{month:"long",year:"numeric"}).format(parseYmd(m+"-01"));
const DOWS = ["dim","lun","mar","mer","jeu","ven","sam"];
const DOWL = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if (v===""||v==null) return null; const n = Number(String(v).replace(",",".").replace(/[’' ]/g,"")); return isFinite(n)?n:null; };
const r1 = n => Math.round(n*10)/10;
const kg = n => n==null?"–":n.toLocaleString("fr-CH",{minimumFractionDigits:1,maximumFractionDigits:1});
const chf = n => n==null?"–":"CHF "+n.toLocaleString("fr-CH",{minimumFractionDigits:2,maximumFractionDigits:2});
const chf0 = n => n==null?"–":"CHF "+Math.round(n).toLocaleString("fr-CH");
const dim = M => { const [y,m] = M.split("-").map(Number); return new Date(y,m,0).getDate(); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sum = (a,f) => a.reduce((s,x)=>s+(f(x)||0),0);

/* ---------- état ---------- */
const S = {
  db:null, dl:null, dbState:"loading",
  loaded:{},
  app:{}, journal:{}, aliments:{}, achats:[], seancesHist:[], sante:{}, poids:{}, mesures:{}, tension:{}, riz:[], fixes:[], factures:[], depenses:[], mois:{}, agenda:{}, notes:[], semaines:{}, dietHist:[],
  view:"accueil", sheet:null,
  ui:{ agendaDay:today(), mois:monthOf(today()), poidsRange:60, dietTab:"jour", dietType:null, jourDiet:today(), typeArm:null, corpsTab:"poids", argentTab:"resume", ecoleWeek:mondayOf(today()), riz:{} }
};
try { const v = localStorage.getItem("qg.view"); if (v) S.view = v; } catch(e){}

const DEF_CATS = ["Fit","Bouffe","Transport","Logement","Abonnements","Santé","Ezekiel","Shopping","Sorties","Divers"];
const cats = () => (S.app.config && S.app.config.categories) || DEF_CATS;
const MES_L = [["cou","Cou","up"],["bicepsG","Biceps G","up"],["poitrine","Poitrine","up"],["abdomen","Abdomen","down"],["cuisseG","Cuisse G","up"],["molletG","Mollet G","up"]];
const MES_R = [["epaule","Épaules","up"],["bicepsD","Biceps D","up"],["taille","Taille","down"],["hanche","Hanches","down"],["cuisseD","Cuisse D","up"],["molletD","Mollet D","up"]];
const MES = [...MES_L, ...MES_R];
const LIEUX = ["Renens","Uni-Mail","Maison","Pas d'école"];
const EZ = {depot:"Dépôt 8h30",recup:"Récup 16h30",rien:"Rien"};

/* ---------- rendu ---------- */
const $app = document.getElementById("app");
let pending = false;
function render(){
  if (!started) return;
  const a = document.activeElement;
  if (a && $app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { pending = true; return; }
  pending = false;
  const v = VIEWS[S.view] ? S.view : "accueil";
  const sc = window.scrollY;
  $app.innerHTML = (S.dbState==="none" ? '<div class="banner">Serveur injoignable. Vérifie ta connexion.</div>' : "") + VIEWS[v].body();
  document.getElementById("ttl").textContent = VIEWS[v].title;
  document.getElementById("sub").textContent = v==="accueil" ? fDay(today()) : "";
  renderTabs();
  if (document.getElementById("rz-out")) rizCalc();
  if (renderKeepScroll) window.scrollTo(0,sc);
  renderKeepScroll = true;
}
let renderKeepScroll = true;
document.addEventListener("focusout", () => { setTimeout(()=>{ if (pending) render(); }, 30); });

const ICONS = {
  accueil:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  agenda:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  corps:'<rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8 9a5 5 0 0 1 8 0"/><path d="M12 9l1.5-2"/>',
  diet:'<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/>',
  argent:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M16 12.5h2"/><path d="M3 10h18"/>',

/* ---------- données dérivées ---------- */
function splitFor(dateS){
  const t = S.app.training; if (!t || !t.jours) return null;
  return t.jours[String(dow(dateS))] || null;
}
function dayType(dateS){
  const sp = splitFor(dateS);
  return sp && sp.nom && sp.nom.toLowerCase()!=="repos" ? "training" : "off";
}
function poidsSorted(){
  return Object.keys(S.poids).sort().map(d=>({d, kg:S.poids[d].kg})).filter(x=>typeof x.kg==="number");
}
function avg7(list, dateS){
  const from = addDays(dateS,-6);
  const xs = list.filter(x=>x.d>=from && x.d<=dateS);
  return xs.length ? sum(xs,x=>x.kg)/xs.length : null;
}
function poidsStats(){
  const L = poidsSorted(); if (!L.length) return null;
  const last = L[L.length-1];
  const a = avg7(L,last.d), b = avg7(L,addDays(last.d,-7));
  return { last, avg:a, prevAvg:b, delta: a!=null&&b!=null ? a-b : null, pct: a!=null&&b ? (a-b)/b*100 : null, list:L };
}
function allFoods(){ const d = S.app.diet; return Object.assign({}, (d && d.aliments) || {}, S.aliments || {}); }
function food(id){ return allFoods()[id]; }
function tplDay(type){ const D = S.app.diet; return D && D.jours && D.jours[type]; }
function journalDraft(d, type){ const t = tplDay(type) || {repas:[]};
  return {date:d, type, repas:(t.repas||[]).map((r,i)=>({id:"t"+i, heure:r.heure||"", nom:r.nom, note:r.note||"", items:(r.items||[]).map(x=>({a:x.a, q:x.q, etat:x.etat||""})), fait:false}))}; }
function journalOf(d){ return S.journal[d] ? JSON.parse(JSON.stringify(S.journal[d])) : journalDraft(d, dayType(d)); }
function journalStats(j){ const all = (j.repas||[]); const eaten = all.filter(r=>r.fait);
  return { mange: eaten.map(mealMacros).reduce(addM,ZERO), prevu: all.map(mealMacros).reduce(addM,ZERO), tpl: dayMacros(tplDay(j.type)), nbFait: eaten.length, nb: all.length }; }
const sortRepas = L => L.sort((a,b)=>(a.heure||"99:99")<(b.heure||"99:99")?-1:(a.heure||"99:99")>(b.heure||"99:99")?1:0);
async function saveJournal(d, j){ const o = {...j, date:d, maj:new Date().toISOString()}; delete o.id; await put("journal/"+d, o); }
function itemMacros(it){
  const a = food(it.a); if (!a) return {kcal:0,p:0,g:0,l:0};
  const f = it.q/100;
  return {kcal:a.kcal*f, p:a.p*f, g:a.g*f, l:a.l*f};
}
function addM(x,y){ return {kcal:x.kcal+y.kcal,p:x.p+y.p,g:x.g+y.g,l:x.l+y.l}; }
const ZERO = {kcal:0,p:0,g:0,l:0};
function mealMacros(m){ return (m.items||[]).map(itemMacros).reduce(addM,ZERO); }
function dayMacros(day){ return (day && day.repas || []).map(mealMacros).reduce(addM,ZERO); }

function finance(M){
  const paid = (S.mois[M] && S.mois[M].payes) || {}, mt = (S.mois[M] && S.mois[M].montants) || {};
  const fixes = S.fixes.filter(f=>f.actif!==false).map(f=>({...f, habituel:f.montant, montant: typeof mt[f.id]==="number" ? mt[f.id] : null, paye:!!paid[f.id], echeance: f.jour ? M+"-"+pad(Math.min(dim(M),f.jour)) : null}));
  const fact = S.factures.filter(f=>f.mois===M || (!f.paye && (f.mois||"")<M));
  const dep = S.depenses.filter(d=>d.date && d.date.startsWith(M));
  const tF = sum(fixes,f=>f.montant), tFa = sum(fact,f=>f.montant), tD = sum(dep,d=>d.montant);
  const resteFixes = sum(fixes.filter(f=>!f.paye),f=>f.montant);
  const resteFact = sum(fact.filter(f=>!f.paye),f=>f.montant);
  const revenu = S.mois[M] && typeof S.mois[M].revenu==="number" ? S.mois[M].revenu : null;
  const parCat = {};
  fixes.forEach(f=>{ const c=f.categorie||"Divers"; parCat[c]=(parCat[c]||0)+(f.montant||0); });
  fact.forEach(f=>{ const c=f.categorie||"Divers"; parCat[c]=(parCat[c]||0)+(f.montant||0); });
  dep.forEach(d=>{ const c=d.categorie||"Divers"; parCat[c]=(parCat[c]||0)+(d.montant||0); });
  const total = tF+tFa+tD;
  return { fixes, fact, dep, tF, tFa, tD, total, reste:resteFixes+resteFact, paye: total-(resteFixes+resteFact),
    revenu, vivre: revenu!=null ? revenu-total : null, fit: parCat.Fit||0, evitable: sum(dep.filter(d=>d.evitable),d=>d.montant), parCat,
    sansMontant: fixes.filter(f=>typeof f.montant!=="number").length,
    achats: sum(S.achats.filter(a=>!a.achete),a=>a.prix), nbAchats: S.achats.filter(a=>!a.achete).length };
}
function boutiques(){ const set = new Set(((S.app.config||{}).boutiques)||["HSN","iHerb"]); S.achats.forEach(a=>set.add(a.boutique||"Autre")); return [...set]; }
function dueSoon(){
  const t = today(), lim = addDays(t,7), M = monthOf(t), F = finance(M);
  const items = [];
  F.fixes.forEach(f=>{ if(!f.paye && f.echeance && f.echeance<=lim) items.push({nom:f.nom, montant:f.montant, d:f.echeance}); });
  S.factures.forEach(f=>{ if(!f.paye && f.echeance && f.echeance<=lim) items.push({nom:f.nom, montant:f.montant, d:f.echeance}); });
  return items.sort((a,b)=>a.d<b.d?-1:1);
}
function weekDoc(mon){ return S.semaines[mon] || {jours:{}}; }

/* ---------- graphique poids ---------- */
function weightChart(list, days){
  if (list.length<2) return '<div class="empty">Le graphique apparaît dès la deuxième pesée.</div>';
  const end = list[list.length-1].d;
  const start = days ? addDays(end,-days+1) : list[0].d;
  const pts = list.filter(x=>x.d>=start);
  if (pts.length<2) return '<div class="empty">Pas assez de pesées sur cette période.</div>';
  const W=340,H=170,L=34,R=10,T=10,B=22;
  const t0 = parseYmd(pts[0].d).getTime(), t1 = parseYmd(end).getTime(), span = Math.max(1,t1-t0);
  const avgs = pts.map(p=>({d:p.d, kg:avg7(list,p.d)}));
  let lo = Math.min(...pts.map(p=>p.kg), ...avgs.map(a=>a.kg)), hi = Math.max(...pts.map(p=>p.kg), ...avgs.map(a=>a.kg));
  lo = Math.floor(lo-0.3); hi = Math.ceil(hi+0.3); if (hi-lo<2) hi = lo+2;
  const x = d => L + (parseYmd(d).getTime()-t0)/span*(W-L-R);
  const y = v => T + (hi-v)/(hi-lo)*(H-T-B);
  const step = Math.max(1, Math.round((hi-lo)/4));
  let g = "";
  for (let v=lo; v<=hi; v+=step) g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+v+'</text>';
  const dots = pts.map(p=>'<circle cx="'+x(p.d).toFixed(1)+'" cy="'+y(p.kg).toFixed(1)+'" r="2.4" fill="var(--muted)" opacity=".55"/>').join("");
  const line = avgs.map((a,i)=>(i?"L":"M")+x(a.d).toFixed(1)+" "+y(a.kg).toFixed(1)).join(" ");
  const area = line+" L"+x(avgs[avgs.length-1].d).toFixed(1)+" "+(H-B)+" L"+x(avgs[0].d).toFixed(1)+" "+(H-B)+" Z";
  const la = avgs[avgs.length-1];
  const lab = '<text x="'+L+'" y="'+(H-6)+'">'+fShort(pts[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+fShort(end)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Courbe du poids et moyenne sur 7 jours">'+g+
    '<path d="'+area+'" fill="var(--accent)" opacity=".10"/>'+dots+'<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+x(la.d)+'" cy="'+y(la.kg)+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'+lab+'</svg>';
}

function mesCard(k,l,bon,col,row){ const L = mesSeries(k), last = L[L.length-1], prev = L[L.length-2]; const d = last&&prev ? r1(last.v-prev.v) : 0;

const dureeTxt = m => m==null ? "–" : Math.floor(m/60)+"h"+pad(Math.round(m%60));

function barChart(items, unite, ref){ // items: [{label, v, v2}]
  if (!items.length) return "";
  const W=340,H=140,B=18,T=8, mx = Math.max(...items.map(x=>Math.max(x.v||0, x.v2||0)), ref||0, 1), bw = (W-8)/items.length;

  items.forEach((x,i)=>{ const X = 4+i*bw; const two = x.v2!=null; const w = two ? bw*0.36 : bw*0.62;
    const h1 = (H-B-T)*(x.v||0)/mx; s += '<rect x="'+(X+(two?bw*0.12:bw*0.19)).toFixed(1)+'" y="'+(H-B-h1).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(0,h1).toFixed(1)+'" rx="2" fill="var(--accent)"/>';
    if (two){ const h2 = (H-B-T)*(x.v2||0)/mx; s += '<rect x="'+(X+bw*0.52).toFixed(1)+'" y="'+(H-B-h2).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(0,h2).toFixed(1)+'" rx="2" fill="var(--good)"/>'; }

}

function suiviView(){
  const days = Object.keys(S.journal).sort().reverse().slice(0,30);
  if (!days.length) return '<section class="card"><span class="eyebrow">Suivi journalier</span><div class="empty">Ton suivi apparaît dès que tu valides tes premiers repas dans le Journal.</div></section>';
  const rows = days.map(d=>{ const st = journalStats(S.journal[d]); return {d, type:S.journal[d].type, st}; });
  const last = rows.slice(0,14).reverse(); const mx = Math.max(...last.map(r=>Math.max(r.st.mange.kcal, r.st.tpl.kcal)), 1);
  const W=340,H=150,B=20,T=8, bw=(W-8)/last.length;
  let svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Calories mangées par jour comparées à la template">';
  last.forEach((r,i)=>{ const x = 4+i*bw, hh = (H-B-T)*r.st.mange.kcal/mx, ht = (H-B-T)*r.st.tpl.kcal/mx;
    svg += '<rect x="'+(x+bw*0.18).toFixed(1)+'" y="'+(H-B-hh).toFixed(1)+'" width="'+(bw*0.64).toFixed(1)+'" height="'+Math.max(0,hh).toFixed(1)+'" rx="3" fill="var(--accent)"/>'+
      '<line x1="'+(x+bw*0.08).toFixed(1)+'" x2="'+(x+bw*0.92).toFixed(1)+'" y1="'+(H-B-ht).toFixed(1)+'" y2="'+(H-B-ht).toFixed(1)+'" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="3 2"/>'+
      (i%2===0||last.length<8?'<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+parseYmd(r.d).getDate()+'</text>':''); });
  svg += '</svg>';
  let h = '<section class="card"><span class="eyebrow">Suivi journalier</span>'+svg+'<div class="row small muted" style="gap:14px"><span><i style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;vertical-align:middle"></i> mangé</span><span><i style="display:inline-block;width:14px;border-top:2px dashed var(--fg);vertical-align:middle"></i> template</span></div>';
  h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Jour</th><th>Kcal</th><th>P</th><th>G</th><th>L</th><th>Respect</th></tr></thead><tbody>'+rows.map(r=>{ const pct = r.st.tpl.kcal ? r.st.mange.kcal/r.st.tpl.kcal*100 : 0; const cls = pct>=95&&pct<=105?"down":"up";
    return '<tr class="tap" data-act="jOpen" data-d="'+r.d+'" style="cursor:pointer"><td>'+DOWS[dow(r.d)]+' '+fShort(r.d)+' <span class="muted">'+(r.type==="training"?"T":"O")+'</span></td><td>'+Math.round(r.st.mange.kcal)+'</td><td>'+Math.round(r.st.mange.p)+'</td><td>'+Math.round(r.st.mange.g)+'</td><td>'+Math.round(r.st.mange.l)+'</td><td class="'+cls+'">'+Math.round(pct)+'%</td></tr>'; }).join("")+'</tbody></table></div>';
  const n = rows.length, avg = k => sum(rows,r=>r.st.mange[k])/n;
  h += '<div class="grid4"><div class="stat"><span class="k">Moy. kcal</span><span class="v num">'+Math.round(avg("kcal"))+'</span></div><div class="stat"><span class="k">Moy. P</span><span class="v num">'+Math.round(avg("p"))+'g</span></div><div class="stat"><span class="k">Moy. G</span><span class="v num">'+Math.round(avg("g"))+'g</span></div><div class="stat"><span class="k">Moy. L</span><span class="v num">'+Math.round(avg("l"))+'g</span></div></div>';
  h += '<div class="hint">Respect = calories mangées par rapport à la template du jour. Vert entre 95 et 105 %.</div></section>';
  return h;
}
function rizCalc(){
  const out = document.getElementById("rz-out"); if (!out) return null;
  const cru = num(val("rz-cru")), brut = num(val("rz-cuit")), tare = num(val("rz-tare"))||0, por = num(val("rz-portion"));
  if (!cru || !brut || brut-tare<=0){ out.innerHTML = '<div class="empty">Entre le poids cru et la pesée après cuisson.</div>'; return null; }
  const cuit = brut-tare, ratio = cuit/cru, pc = por ? por*ratio : null;
  out.innerHTML = '<div class="stat" style="align-items:center;padding:14px"><span class="k">Grammes cuits par portion</span><span class="big num" style="font-size:56px">'+(pc?Math.round(pc):"–")+' g</span></div>'+
    '<div class="grid3"><div class="stat"><span class="k">Riz cuit net</span><span class="v num">'+Math.round(cuit)+' g</span></div><div class="stat"><span class="k">Ratio</span><span class="v num">×'+ratio.toFixed(2)+'</span></div><div class="stat"><span class="k">Portions</span><span class="v num">'+(por?(cru/por).toFixed(1):"–")+'</span></div></div>';
  return {cru, brut, tare, cuit, ratio, portionCrue:por, portionCuite:pc};
}

async function prepImage(file){
  try { const bmp = await createImageBitmap(file); const k = Math.min(3, Math.max(1, 2000/bmp.width));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    const x = c.getContext("2d"); x.filter = "grayscale(1) contrast(1.4)"; x.drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file), "image/png")); } catch(e){ return file; } }
async function ocrImage(file, onProgress){
  if (!window.Tesseract) await loadScript("vendor/ocr/tesseract.min.js");
  const base = new URL("vendor/ocr/", location.href).href;
  const worker = await window.Tesseract.createWorker("eng", 1, { workerPath: base+"worker.min.js", corePath: base, langPath: base, workerBlobURL: false, gzip: true,
    logger: m => { if (m.status==="recognizing text" && onProgress) onProgress(Math.round(m.progress*100)); } });
  try { const img = await prepImage(file); const r = await worker.recognize(img, {}, {blocks:true, text:true});
    const res = parseRenpho(r.data);
    const manque = Object.entries(res.labels).filter(([k])=>res.vals[k]==null);
    if (manque.length){ await worker.setParameters({tessedit_char_whitelist:"0123456789.,", tessedit_pageseg_mode:"7"});
      for (const [k,b] of manque){ const top = b.y1 + 2, h = Math.round(res.H*0.045);
        const rr = await worker.recognize(img, {rectangle:{left:Math.max(0,b.x0-8), top, width:Math.round(res.W*0.2), height:h}});
        const m = /(\d{2,3})[.,](\d)/.exec(rr.data.text||""); if (m){ const v = +(m[1]+"."+m[2]); if (v>=15 && v<=250) res.vals[k] = v; } } }
    return res.vals; } finally { await worker.terminate(); }
}
const OCR_LABELS = [
  [/^(l|g)[-_ ]?biceps/,"bicepsG"],[/^(r|d)[-_ ]?biceps/,"bicepsD"],[/^(l|g)[-_ ]?(cuisse|thigh)/,"cuisseG"],[/^(r|d)[-_ ]?(cuisse|thigh)/,"cuisseD"],
  [/^(l|g)[-_ ]?(mollet|calf)/,"molletG"],[/^(r|d)[-_ ]?(mollet|calf)/,"molletD"],[/^(cou|neck)$/,"cou"],[/^(epaule|epaules|shoulder)/,"epaule"],
  [/^(poitrine|chest)/,"poitrine"],[/^(taille|waist)/,"taille"],[/^abdomen/,"abdomen"],[/^(hanche|hanches|hip)/,"hanche"]];
function parseRenpho(data){
  const norm = t => String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9.,-]/g,"");
  const lines = []; (data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>lines.push(l))));
  const words = lines.flatMap(l=>l.words||[]);
  let W = 1, H = 1; words.forEach(w=>{ W = Math.max(W, w.bbox.x1); H = Math.max(H, w.bbox.y1); });
  const nums = words.map(w=>{ const m = /^(\d{2,3})[.,](\d)$/.exec(String(w.text).trim()); return m ? {v:+(m[1]+"."+m[2]), b:w.bbox, used:false} : null; }).filter(x=>x && x.v>=15 && x.v<=250);
  const out = {}, labels = {};
  words.forEach(w=>{ const t = norm(w.text); const hit = OCR_LABELS.find(([re])=>re.test(t)); if (!hit || labels[hit[1]]) return;
    const lb = w.bbox; labels[hit[1]] = lb; let best = null, bd = Infinity;
    nums.forEach(n=>{ if (n.used) return; const dy = n.b.y0 - lb.y0, dx = n.b.x0 - lb.x0;
      if (dy < 4 || dy > H*0.06 || dx < -W*0.04 || dx > W*0.12) return; const d = dy + Math.abs(dx)*0.5; if (d < bd){ bd = d; best = n; } });
    if (best){ best.used = true; out[hit[1]] = best.v; } });
  return {vals:out, labels, W, H};
}

const queues = {};
function put(path, data){
  if (!S.db) { toast("Base indisponible : rien n'a été enregistré.",true); return Promise.reject(new Error("no db")); }
  const prev = queues[path] || Promise.resolve();
  const p = prev.catch(()=>{}).then(()=>S.db.doc(path).set(data)).catch(e=>{ handleErr(e); throw e; });
  queues[path] = p; return p;
}
function rm(path){
  if (!S.db) return Promise.reject(new Error("no db"));
  const prev = queues[path] || Promise.resolve();
  const p = prev.catch(()=>{}).then(()=>S.db.doc(path).delete()).catch(e=>{ handleErr(e); throw e; });
  queues[path] = p; return p;
}
function handleErr(e){
  const c = e && e.code;
  if (c==="quota_exceeded") toast("Base pleine : supprime d'anciennes données ou exporte-les.",true);
  else if (c==="write_failed") toast("Échec de l'enregistrement. Vérifie ta connexion et réessaie.",true);
  else toast("Échec de l'enregistrement. Vérifie ta connexion et réessaie.",true);
}
function editDay(i, fn){
  const mon = S.ui.ecoleWeek; const W = JSON.parse(JSON.stringify(weekDoc(mon))); W.jours = W.jours||{};
  const j = W.jours[String(i)] = W.jours[String(i)] || {}; fn(j); W.lundi = mon;
  return put("ecole_semaines/"+mon, W);
}

S.durees = null; S.agUi = {shift:false};

function legTxt(l){
  if (l.type==="trott") return "Trottinette · "+shortStop(l.de)+" "+hfr(hhmm(l.dep))+" → "+shortStop(l.vers)+" "+hfr(hhmm(l.arr));
  if (l.type!=="pt") return l.minutes>=3 ? "Marche "+l.minutes+" min" : "";
  const lab = l.mode==="tram" ? "Tram "+l.ligne : l.mode==="bus" ? "Bus "+l.ligne : (l.ligne||l.cat);
  const dd = delayMin(l.dep), da = delayMin(l.arr);
  const voie = l.mode==="rail" && l.dep.voie ? " (voie "+l.dep.voie+")" : "";
  return lab+" · "+shortStop(l.dep.nom)+" "+hfr(hhmm(l.dep.prevu))+(dd>0?" (+"+dd+")":"")+voie+" → "+shortStop(l.arr.nom)+" "+hfr(hhmm(l.arr.prevu))+(da>0?" (+"+da+")":"")+(l.annule?" · SUPPRIMÉ":"");
}
const optLines = o => o ? o.legs.map(legTxt).filter(Boolean) : [];
function pickOptions(trips, mode, cibleIso){
  const ok = trips.filter(t=>t.legs.some(l=>l.type==="pt") && !t.legs.some(l=>l.annule));
  const noRE = ok.filter(t=>!tripHasRE(t)); const pool = noRE.length ? noRE : ok; const c = new Date(cibleIso).getTime();
  let L = mode==="arriver" ? pool.filter(t=>new Date(t.arrivee).getTime()<=c+60000).sort((a,b)=>a.arrivee>b.arrivee?-1:1)
                           : pool.filter(t=>new Date(t.depart).getTime()>=c-60000).sort((a,b)=>a.depart<b.depart?-1:1);
  if (!L.length) L = pool.slice();
  return L.slice(0,3);
}
async function trajetOptions(depuis, vers, mode, dateS, min, cache){
  const iso = isoAt(dateS, min), k = depuis.ref+"|"+vers.ref+"|"+mode+"|"+iso;
  if (cache && cache[k]) return cache[k];
  const r = await api({action:"trajet", from:depuis, to:vers, time:iso, arrive:mode==="arriver", n:6});
  const o = pickOptions(r.trajets||[], mode, iso); if (cache) cache[k] = o; return o;
}
// Trajet en plusieurs tronçons (ex. trottinette puis bus 22). Chaque chaîne = un itinéraire possible.
async function chainOptions(chaines, dateS, min, cache){
  const out = [];
  for (const chain of chaines){
    const hasPt = chain.some(sg=>!sg.trott);
    for (const variant of (hasPt ? [0,1] : [0])){
      let t = min, legs = [], depart = null, arrivee = null, ok = true, first = true;
      for (let k=0; k<chain.length; k++){ const sg = chain[k];
        if (sg.trott){ const dep = isoAt(dateS, t), arr = isoAt(dateS, t+sg.trott);
          legs.push({type:"trott", minutes:sg.trott, de:sg.de.nom, vers:sg.a.nom, dep, arr}); depart = depart||dep; arrivee = arr; t += sg.trott; continue; }
        const opts = await trajetOptions(sg.de, sg.a, "partir", dateS, t, cache); const idx = first ? variant : 0; first = false;
        if (!opts.length || idx>=opts.length){ ok = false; break; }
        const o = opts[idx]; legs.push(...o.legs); depart = depart||o.depart; arrivee = o.arrivee;
        t = isoMinLocal(o.arrivee) + (chain[k+1] && !chain[k+1].trott ? 2 : 0); }
      if (ok && legs.length) out.push({depart, arrivee, minutes:Math.round((new Date(arrivee)-new Date(depart))/60000), changements:Math.max(0, legs.filter(l=>l.type!=="marche").length-1), legs});
    }
  }
  const seen = {}; return out.filter(o=>{ const k = o.depart+o.arrivee+o.legs.map(l=>l.ligne||l.type).join(); if (seen[k]) return false; seen[k] = 1; return true; })
    .sort((a,b)=>a.arrivee<b.arrivee?-1:1).slice(0,3);
}
const tjOptions = (tj, dateS, min, cache) => tj.chaines ? chainOptions(tj.chaines, dateS, min, cache||{}) : trajetOptions(tj.depuis, tj.vers, tj.mode, dateS, min, cache||{});
const optSel = tj => tj && tj.options && tj.options[tj.choisi||0];
const arrMinOf = tj => optSel(tj) ? isoMinLocal(optSel(tj).arrivee) : null;
const depMinOf = tj => optSel(tj) ? isoMinLocal(optSel(tj).depart) : null;
function dureeSeance(type){ const c = agCfg(); return (S.durees && S.durees[type]) || c.durees[type] || 80; }

/* ---------- données d'un jour ---------- */
function dayDoc(d){
  const a = S.agenda[d]; if (!a) return {date:d, taches:[]};
  if (a.taches) return a;
  return {...a, taches:(a.items||[]).map(i=>({id:i.id, debut:i.heure||"", titre:i.titre, fait:!!i.fait, type:"libre", trajets:[], trajetTexte:i.trajet||""}))};
}
const sortT = L => L.sort((a,b)=>(a.debut||"99:99")<(b.debut||"99:99")?-1:(a.debut||"99:99")>(b.debut||"99:99")?1:0);
async function saveDay(doc){ const o = JSON.parse(JSON.stringify(doc)); delete o.id; delete o.items; sortT(o.taches); await put("agenda/"+o.date, o); }
function sousTitre(seance, salle, lieu, chien){
  const p = [];
  if (seance && seance!=="repos") p.push(seance+" à "+(salle==="sunset"?"Sunset":"American"));
  if (chien) p.push("chien chez ma mère");
  if (lieu==="Renens"||lieu==="Uni-Mail") p.push("école à "+lieu); else if (lieu==="Maison") p.push("école à la maison");
  return p.join(", ");
}

/* ---------- rendu d'une tâche ---------- */
function trajetBlock(tj){
  const lines = optLines(optSel(tj)); if (!lines.length) return "";
  if (tj.label) lines[0] = tj.label+" · "+lines[0];
  return '<div class="trajet">'+lines.map(esc).join("<br>")+'</div>';
}
function tacheHtml(d, t, i, opts){
  opts = opts||{};
  const heure = t.debut ? hfr(t.debut)+(t.fin?" - "+hfr(t.fin):"") : "";
  let h = '<div class="li'+(t.fait?' done':'')+'" style="align-items:flex-start">'+(opts.static?'<span class="check" aria-hidden="true"></span>':chk(t.fait,"tFait",'data-d="'+d+'" data-i="'+i+'"'))+
    (opts.static?'<div class="grow" style="min-width:0">':'<div class="grow tap" data-act="sheet" data-s="tache" data-d="'+d+'" data-i="'+i+'" style="cursor:pointer;min-width:0">')+
    '<div><b class="num">'+esc(heure)+'</b>'+(heure?'&nbsp; ':'')+'<span class="t">'+esc(t.titre)+'</span></div>'+
    (t.fait && t.faitA ? '<div class="small muted">fini à '+hfr(t.faitA)+'</div>' : '')+
    (t.note ? '<div class="small muted">'+esc(t.note)+'</div>' : '')+
    (t.trajets||[]).map(trajetBlock).join("")+(t.trajetTexte?'<div class="trajet">'+esc(t.trajetTexte)+'</div>':'')+'</div></div>';
  if (t.type==="seance" && !opts.static && d===today() && !t.fait){
    const s = t.seance||{};
    if (!s.debutReel) h += '<div style="padding:0 0 10px 34px"><button class="btn sm pri" data-act="seanceStart" data-d="'+d+'" data-i="'+i+'">J\'ai commencé la séance</button></div>';
    else if (!s.finReelle) h += '<div style="padding:0 0 10px 34px" class="stack"><span class="small">Commencée à '+hfr(s.debutReel)+', fin estimée '+hfr(t.fin)+'</span><button class="btn sm pri" data-act="seanceFin" data-d="'+d+'" data-i="'+i+'">J\'ai fini la séance</button></div>';
  }
  return h;
}

function weekView(){
  const mon = mondayOf(today()); let h = '';
  for (let i=0;i<7;i++){ const d = addDays(mon,i), doc = dayDoc(d), T = sortT(doc.taches.slice());

      (T.length?'<div class="small">'+T.slice(0,6).map(x=>(x.fait?"[x] ":"[ ] ")+(x.debut?hfr(x.debut)+" ":"")+esc(x.titre)).join("<br>")+'</div>':'<div class="small muted">Rien de prévu.</div>')+'</section>'; }

function recapHtml(doc){

    '<div class="small"><b>Fait ('+f.length+')</b><br>'+(f.map(x=>esc(x.titre)+(x.faitA?" à "+hfr(x.faitA):"")).join("<br>")||"Rien")+'</div>'+

async function retimeTrajet(dateS, tj, deltaMin, cache){
  const m = toMin(tj.heureCible); if (m==null) return tj;
  const nm = m + deltaMin; const options = await tjOptions(tj, dateS, nm, cache||{});
  return {...tj, heureCible:fromMin(nm), options, choisi:0};
}
async function shiftTaches(dateS, taches, n, cache){
  for (const t of taches){ if (t.fait) continue;
    if (t.debut) t.debut = fromMin(toMin(t.debut)+n); if (t.fin) t.fin = fromMin(toMin(t.fin)+n);
    if (t.trajets) for (let j=0;j<t.trajets.length;j++) t.trajets[j] = await retimeTrajet(dateS, t.trajets[j], n, cache); }
}

    '<div class="field"><label for="lg-pass">Mot de passe</label><input class="inp" id="lg-pass" type="password" autocomplete="'+(up?"new-password":"current-password")+'" minlength="8" required></div>'+
    '<button class="btn pri full" type="submit">'+(up?"Créer mon compte":"Se connecter")+'</button>'+
    '<button class="btn ghost full" type="button" data-act="authMode">'+(up?"J\'ai déjà un compte : me connecter":"Première fois : créer mon compte")+'</button></form>';
}
const AUTH_ERR = m => /invalid login/i.test(m) ? "Email ou mot de passe incorrect." : /not confirmed/i.test(m) ? "Confirme d'abord ton email avec le lien reçu, puis reconnecte-toi." : /fermees|database error/i.test(m) ? "Les inscriptions sont fermées : ce QG a déjà son propriétaire." : /password/i.test(m) ? "Mot de passe trop court : 8 caractères minimum." : m;
ACT.signup = async () => {
  const email = val("lg-mail").trim(), password = val("lg-pass");
  if (!email || password.length<8) return renderLogin("Entre ton email et un mot de passe d'au moins 8 caractères, puis touche « créer mon compte ».", true);
  const {data, error} = await sb.auth.signUp({email, password, options:{emailRedirectTo: location.origin+location.pathname}});
  if (error) return renderLogin(AUTH_ERR(error.message), true);
  if (data.session) return start(data.session);
  authMode = "in";
  renderLogin("Compte créé. Ouvre l'email de confirmation, touche le lien, puis reviens ici te connecter.");
};
ACT.authMode = () => { const m = val("lg-mail"); authMode = authMode==="up" ? "in" : "up"; renderLogin(); const e = document.getElementById("lg-mail"); if (e) e.value = m; };
ACT.logout = async () => { await sb.auth.signOut(); location.reload(); };
document.addEventListener("submit", async e => {
  if (e.target.dataset.form==="mfa"){ e.preventDefault();
    const code = val("mfa-code").replace(/\D/g,""); if (code.length!==6) return renderMfa(mfaState, "Entre les 6 chiffres du code.");
    const {error} = await sb.auth.mfa.challengeAndVerify({factorId:mfaState.factorId, code});
    if (error) return renderMfa(mfaState, "Code incorrect ou expiré. Prends le code actuel et réessaie.");
    const {data} = await sb.auth.getSession(); return launch(data.session); }
  if (e.target.dataset.form!=="login") return; e.preventDefault();
  if (authMode==="up") return ACT.signup();
  const {data, error} = await sb.auth.signInWithPassword({email:val("lg-mail").trim(), password:val("lg-pass")});
  if (error) return renderLogin(AUTH_ERR(error.message), true);
  start(data.session);
}, true);

let started = false, gating = false;
async function mfaGate(){
  const {data:aal} = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal && aal.currentLevel==="aal2") return true;
  const {data:f, error} = await sb.auth.mfa.listFactors(); if (error) throw error;
  const ok = (f.totp||[]).filter(x=>x.status==="verified");
  if (ok.length){ renderMfa({mode:"code", factorId:ok[0].id}); return false; }
  for (const x of (f.all||[])) if (x.status!=="verified") await sb.auth.mfa.unenroll({factorId:x.id});
  const {data:en, error:e2} = await sb.auth.mfa.enroll({factorType:"totp", friendlyName:"QG iPhone "+Date.now().toString(36)}); if (e2) throw e2;
  renderMfa({mode:"enroll", factorId:en.id, qr:en.totp.qr_code, secret:en.totp.secret, uri:en.totp.uri}); return false;
}
let mfaState = null;
function renderMfa(st, msg){
  mfaState = st;
  const en = st.mode==="enroll";
  $app.innerHTML = '<form class="login" data-form="mfa"><div class="big">QG</div>'+
    (en ? '<div class="h2">Active la double sécurité</div><div class="small">Sans ce code à 6 chiffres, personne ne peut lire tes données, même avec ton mot de passe.</div>'+
      '<div class="card small"><b>1.</b> Touche ce bouton : ton iPhone propose d\'ajouter le code dans l\'app Mots de passe.<a class="btn pri full" href="'+esc(st.uri)+'">Ajouter le code à mon iPhone</a>'+
      '<b>Si rien ne s\'ouvre :</b> app Mots de passe, Codes, +, Saisir la clé de configuration, puis colle cette clé :<div class="row"><code class="grow" style="overflow-wrap:anywhere;font-size:13px">'+esc(st.secret)+'</code><button class="btn sm" type="button" data-act="copySecret">Copier</button></div>'+
      '<div class="small muted">Ou scanne ce QR code avec un autre appareil :</div><img src="'+esc(st.qr)+'" alt="QR code de configuration" style="width:160px;height:160px;background:#fff;border-radius:8px;padding:6px"></div>'+
      '<div class="small"><b>2.</b> Entre le code à 6 chiffres affiché pour QG :</div>'
    : '<div class="h2">Code de sécurité</div><div class="small muted">Ouvre l\'app Mots de passe, section Codes, et entre le code à 6 chiffres de QG.</div>')+
    (msg?'<div class="banner">'+esc(msg)+'</div>':'')+
    '<input class="inp big-inp num" id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>'+
    '<button class="btn pri full" type="submit">Valider</button><button class="btn ghost full" type="button" data-act="logout">Se déconnecter</button></form>';
}
ACT.copySecret = () => { const s = mfaState && mfaState.secret; if (!s) return; navigator.clipboard.writeText(s).then(()=>toast("Clé copiée"), ()=>toast("Copie impossible : sélectionne la clé à la main.", true)); };
async function start(session){
  if (started || gating) return; gating = true;
  try { const ok = await mfaGate(); gating = false; if (ok) launch(session); }
  catch(e){ gating = false; renderLogin("Erreur de sécurité : "+(e.message||e)+". Réessaie.", true); }
}
async function launch(session){
  if (started) return; started = true;
  Store.uid = session.user.id; S.db = dbAdapter; S.dbState = "ok"; S.dl = true;
  COLS.forEach(c=>{ const m = {app:"app",poids:"poids",mesures:"mesures",tension:"tension",riz:"riz",fixes:"fixes",factures:"factures",depenses:"depenses",mois:"mois",agenda:"agenda",notes:"notes",ecole_semaines:"semaines",diet_historique:"dietHist",journal:"journal",aliments:"aliments",achats:"achats",seances:"seancesHist",sante:"sante"}[c];
    const asMap = ["app","poids","mesures","tension","mois","agenda","ecole_semaines","journal","aliments","sante"].includes(c);
    sub(c, L => { S[m] = asMap ? byId(L) : L; }); });
  render();
  try { await Store.loadAll(); } catch(e){ toast("Impossible de charger tes données. Vérifie ta connexion.", true); }
  Store.live();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) Store.loadAll().catch(()=>{}); });
}
/* ---------- mise à jour automatique de l'app ---------- */
const APP_VERSION = "20261027095516";
async function checkUpdate(){
  try { const r = await fetch(location.pathname, {cache:"reload"}); const t = await r.text();
    const m = /const APP_VERSION = "(\d+)"/.exec(t);
    if (m && /^\d+$/.test(APP_VERSION) && m[1] > APP_VERSION){ if (!S.sheet){ location.reload(); } } } catch(e){}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
setTimeout(checkUpdate, 1500);
async function boot(){
  if (!sb){ $app.innerHTML = '<div class="banner">Impossible de joindre le serveur. Vérifie ta connexion puis recharge.</div>'; return; }
  const {data} = await sb.auth.getSession();
  if (data.session) start(data.session); else renderLogin();
  sb.auth.onAuthStateChange((ev, session) => { if (ev==="SIGNED_OUT"){ started=false; renderLogin(); } });
}
setInterval(()=>{ const t = today(); if (t!==boot._d){ boot._d=t; render(); } }, 60000); boot._d = today();
boot();
})();
</script>
