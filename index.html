<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout : app mobile à une colonne, en-tête collant, barre d'onglets fixe en bas ; tons fonte et laiton. */
:root{
  --bg:#101214; --surface:#191c1f; --surface2:#22262a; --line:#2d3237; --fg:#ecebe6; --muted:#979da3;
  --accent:#dfa64a; --accent-soft:rgba(223,166,74,.14); --on-accent:#1b1406;
  --good:#5fbf8a; --good-soft:rgba(95,191,138,.14); --warn:#e8813f; --warn-soft:rgba(232,129,63,.14); --bad:#e25d5d; --bad-soft:rgba(226,93,93,.14);
  --scrim:rgba(0,0,0,.55);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-s:9px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eff1f2; --surface:#ffffff; --surface2:#e7eaec; --line:#d5d9dc; --fg:#15181a; --muted:#5b636a;
  --accent:#a46d14; --accent-soft:rgba(164,109,20,.12); --on-accent:#ffffff;
  --good:#2b8653; --good-soft:rgba(43,134,83,.12); --warn:#bf5718; --warn-soft:rgba(191,87,24,.12); --bad:#c13a3a; --bad-soft:rgba(193,58,58,.12);
  --scrim:rgba(20,24,28,.4); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eff1f2; --surface:#ffffff; --surface2:#e7eaec; --line:#d5d9dc; --fg:#15181a; --muted:#5b636a;
  --accent:#a46d14; --accent-soft:rgba(164,109,20,.12); --on-accent:#ffffff;
  --good:#2b8653; --good-soft:rgba(43,134,83,.12); --warn:#bf5718; --warn-soft:rgba(191,87,24,.12); --bad:#c13a3a; --bad-soft:rgba(193,58,58,.12);
  --scrim:rgba(20,24,28,.4); color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 10px;border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase}
.top .sub{color:var(--muted);font-size:13px;display:inline-block}
.cap{display:inline-block}.cap::first-letter,.top .sub::first-letter{text-transform:uppercase}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.h2{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.1;margin:0;text-wrap:balance}
.big{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.95;letter-spacing:-.01em}
.mid{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap-r{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:380px){.grid4{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface2);border-radius:var(--r-s);padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.05}
.stat .k{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.divider{height:1px;background:var(--line);margin:2px 0}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:transparent;border-color:var(--bad-soft)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn.full{width:100%}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface2);border-radius:10px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex:none}

.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-size:13.5px;font-weight:600;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.li .amt{font-weight:600;white-space:nowrap}
.li.tap{cursor:pointer}
.check{appearance:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:transparent;flex:none;display:inline-grid;place-items:center;padding:0}
.check[aria-checked="true"]{background:var(--good);border-color:var(--good)}
.check[aria-checked="true"]::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.done .t{color:var(--muted);text-decoration:line-through}

.trajet{margin:4px 0 0;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.inp{appearance:none;width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none}
.inp.big-inp{font-family:var(--f-display);font-size:28px;font-weight:600;text-align:center;padding:6px}
.hint{font-size:12px;color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}

.empty{padding:18px 12px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:var(--r-s)}
.banner{padding:12px 14px;border-radius:var(--r-s);background:var(--warn-soft);color:var(--warn);font-size:14px}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{appearance:none;flex:none;width:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.day b{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1}
.day span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] span{color:var(--on-accent)}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.day[aria-pressed="true"] .dot{background:var(--on-accent)}

.meal{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.meal:first-of-type{border-top:0;padding-top:0}
.food{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:14px;align-items:baseline}
.food .g{font-weight:600}
.food .k{color:var(--muted);min-width:62px;text-align:right}
.macros{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.macros b{color:var(--fg);font-weight:600}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.up{color:var(--warn)} .down{color:var(--good)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{appearance:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

.sheet-bg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
.toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.btn:active{transform:none}}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
</style>
</head>
<body>
<header class="top"><div class="top-in"><h1 id="ttl">QG</h1><span class="sub" id="sub"></span></div></header>
<main><div class="wrap" id="app"><div class="empty">Chargement de tes données…</div></div></main>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div id="sheet"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- utilitaires ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const monthOf = s => s.slice(0,7);
const addMonths = (m,n) => { const [y,mo] = m.split("-").map(Number); const d = new Date(y,mo-1+n,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); };
const mondayOf = s => { const d = parseYmd(s); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return ymd(d); };
const dow = s => parseYmd(s).getDay();
const fmt = (s,o) => new Intl.DateTimeFormat("fr-CH",o).format(parseYmd(s));
const fDay = s => fmt(s,{weekday:"long",day:"numeric",month:"long"});
const fShort = s => fmt(s,{day:"numeric",month:"short"});
const fMonth = m => new Intl.DateTimeFormat("fr-CH",{month:"long",year:"numeric"}).format(parseYmd(m+"-01"));
const DOWS = ["dim","lun","mar","mer","jeu","ven","sam"];
const DOWL = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if (v===""||v==null) return null; const n = Number(String(v).replace(",",".").replace(/[’' ]/g,"")); return isFinite(n)?n:null; };
const r1 = n => Math.round(n*10)/10;
const kg = n => n==null?"–":n.toLocaleString("fr-CH",{minimumFractionDigits:1,maximumFractionDigits:1});
const chf = n => n==null?"–":"CHF "+n.toLocaleString("fr-CH",{minimumFractionDigits:2,maximumFractionDigits:2});
const chf0 = n => n==null?"–":"CHF "+Math.round(n).toLocaleString("fr-CH");
const dim = M => { const [y,m] = M.split("-").map(Number); return new Date(y,m,0).getDate(); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sum = (a,f) => a.reduce((s,x)=>s+(f(x)||0),0);

/* ---------- état ---------- */
const S = {
  db:null, dl:null, dbState:"loading",
  loaded:{},
  app:{}, poids:{}, mesures:{}, tension:{}, riz:[], fixes:[], factures:[], depenses:[], mois:{}, agenda:{}, notes:[], semaines:{}, dietHist:[],
  view:"accueil", sheet:null,
  ui:{ agendaDay:today(), mois:monthOf(today()), poidsRange:60, dietTab:"plan", dietType:null, corpsTab:"poids", argentTab:"resume", ecoleWeek:mondayOf(today()), riz:{} }
};
try { const v = localStorage.getItem("qg.view"); if (v) S.view = v; } catch(e){}

const DEF_CATS = ["Fit","Bouffe","Transport","Logement","Abonnements","Santé","Ezekiel","Shopping","Sorties","Divers"];
const cats = () => (S.app.config && S.app.config.categories) || DEF_CATS;
const MES = [["cou","Cou"],["epaules","Épaules"],["poitrine","Poitrine"],["brasR","Bras relâché"],["brasC","Bras contracté"],["taille","Taille (nombril)"],["hanches","Hanches"],["cuisse","Cuisse"],["mollet","Mollet"]];
const LIEUX = ["Renens","Uni-Mail","Maison","Pas d'école"];
const EZ = {depot:"Dépôt 8h30",recup:"Récup 16h30",rien:"Rien"};

/* ---------- rendu ---------- */
const $app = document.getElementById("app");
let pending = false;
function render(){
  if (!started) return;
  const a = document.activeElement;
  if (a && $app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { pending = true; return; }
  pending = false;
  const v = VIEWS[S.view] ? S.view : "accueil";
  const sc = window.scrollY;
  $app.innerHTML = (S.dbState==="none" ? '<div class="banner">Serveur injoignable. Vérifie ta connexion.</div>' : "") + VIEWS[v].body();
  document.getElementById("ttl").textContent = VIEWS[v].title;
  document.getElementById("sub").textContent = v==="accueil" ? fDay(today()) : "";
  renderTabs();
  if (document.getElementById("rz-out")) rizCalc();
  if (renderKeepScroll) window.scrollTo(0,sc);
  renderKeepScroll = true;
}
let renderKeepScroll = true;
document.addEventListener("focusout", () => { setTimeout(()=>{ if (pending) render(); }, 30); });

const ICONS = {
  accueil:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  agenda:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  corps:'<rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8 9a5 5 0 0 1 8 0"/><path d="M12 9l1.5-2"/>',
  diet:'<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/>',
  argent:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M16 12.5h2"/><path d="M3 10h18"/>',
  ecole:'<path d="M2.5 9L12 5l9.5 4-9.5 4z"/><path d="M6.5 11v4.5c3 2 8 2 11 0V11"/>'
};
const TABS = [["accueil","Accueil"],["agenda","Agenda"],["corps","Corps"],["diet","Diet"],["argent","Argent"],["ecole","École"]];
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(([k,l]) =>
    '<button class="tab" data-act="go" data-v="'+k+'"'+(S.view===k?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[k]+'</svg>'+l+'</button>').join("");
}

function toast(msg, err){
  const t = document.getElementById("toast");
  t.innerHTML = '<div class="toast'+(err?' err':'')+'" role="status">'+esc(msg)+'</div>';
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.innerHTML=""; }, err?4000:1800);
}

/* ---------- données dérivées ---------- */
function splitFor(dateS){
  const t = S.app.training; if (!t || !t.jours) return null;
  return t.jours[String(dow(dateS))] || null;
}
function dayType(dateS){
  const sp = splitFor(dateS);
  return sp && sp.nom && sp.nom.toLowerCase()!=="repos" ? "training" : "off";
}
function poidsSorted(){
  return Object.keys(S.poids).sort().map(d=>({d, kg:S.poids[d].kg})).filter(x=>typeof x.kg==="number");
}
function avg7(list, dateS){
  const from = addDays(dateS,-6);
  const xs = list.filter(x=>x.d>=from && x.d<=dateS);
  return xs.length ? sum(xs,x=>x.kg)/xs.length : null;
}
function poidsStats(){
  const L = poidsSorted(); if (!L.length) return null;
  const last = L[L.length-1];
  const a = avg7(L,last.d), b = avg7(L,addDays(last.d,-7));
  return { last, avg:a, prevAvg:b, delta: a!=null&&b!=null ? a-b : null, pct: a!=null&&b ? (a-b)/b*100 : null, list:L };
}
function food(id){ const d = S.app.diet; return d && d.aliments && d.aliments[id]; }
function itemMacros(it){
  const a = food(it.a); if (!a) return {kcal:0,p:0,g:0,l:0};
  const f = it.q/100;
  return {kcal:a.kcal*f, p:a.p*f, g:a.g*f, l:a.l*f};
}
function addM(x,y){ return {kcal:x.kcal+y.kcal,p:x.p+y.p,g:x.g+y.g,l:x.l+y.l}; }
const ZERO = {kcal:0,p:0,g:0,l:0};
function mealMacros(m){ return (m.items||[]).map(itemMacros).reduce(addM,ZERO); }
function dayMacros(day){ return (day && day.repas || []).map(mealMacros).reduce(addM,ZERO); }

function finance(M){
  const paid = (S.mois[M] && S.mois[M].payes) || {};
  const fixes = S.fixes.filter(f=>f.actif!==false).map(f=>({...f, paye:!!paid[f.id], echeance: f.jour ? M+"-"+pad(Math.min(dim(M),f.jour)) : null}));
  const fact = S.factures.filter(f=>f.mois===M);
  const dep = S.depenses.filter(d=>d.date && d.date.startsWith(M));
  const tF = sum(fixes,f=>f.montant), tFa = sum(fact,f=>f.montant), tD = sum(dep,d=>d.montant);
  const resteFixes = sum(fixes.filter(f=>!f.paye),f=>f.montant);
  const resteFact = sum(fact.filter(f=>!f.paye),f=>f.montant);
  const revenu = S.mois[M] && typeof S.mois[M].revenu==="number" ? S.mois[M].revenu : null;
  const parCat = {};
  fixes.forEach(f=>{ const c=f.categorie||"Divers"; parCat[c]=(parCat[c]||0)+(f.montant||0); });
  fact.forEach(f=>{ const c=f.categorie||"Divers"; parCat[c]=(parCat[c]||0)+(f.montant||0); });
  dep.forEach(d=>{ const c=d.categorie||"Divers"; parCat[c]=(parCat[c]||0)+(d.montant||0); });
  const total = tF+tFa+tD;
  return { fixes, fact, dep, tF, tFa, tD, total, reste:resteFixes+resteFact, paye: total-(resteFixes+resteFact),
    revenu, vivre: revenu!=null ? revenu-total : null, fit: parCat.Fit||0, evitable: sum(dep.filter(d=>d.evitable),d=>d.montant), parCat,
    sansMontant: fixes.filter(f=>typeof f.montant!=="number").length };
}
function dueSoon(){
  const t = today(), lim = addDays(t,7), M = monthOf(t), F = finance(M);
  const items = [];
  F.fixes.forEach(f=>{ if(!f.paye && f.echeance && f.echeance<=lim) items.push({nom:f.nom, montant:f.montant, d:f.echeance}); });
  S.factures.forEach(f=>{ if(!f.paye && f.echeance && f.echeance<=lim) items.push({nom:f.nom, montant:f.montant, d:f.echeance}); });
  return items.sort((a,b)=>a.d<b.d?-1:1);
}
function weekDoc(mon){ return S.semaines[mon] || {jours:{}}; }

/* ---------- graphique poids ---------- */
function weightChart(list, days){
  if (list.length<2) return '<div class="empty">Le graphique apparaît dès la deuxième pesée.</div>';
  const end = list[list.length-1].d;
  const start = days ? addDays(end,-days+1) : list[0].d;
  const pts = list.filter(x=>x.d>=start);
  if (pts.length<2) return '<div class="empty">Pas assez de pesées sur cette période.</div>';
  const W=340,H=170,L=34,R=10,T=10,B=22;
  const t0 = parseYmd(pts[0].d).getTime(), t1 = parseYmd(end).getTime(), span = Math.max(1,t1-t0);
  const avgs = pts.map(p=>({d:p.d, kg:avg7(list,p.d)}));
  let lo = Math.min(...pts.map(p=>p.kg), ...avgs.map(a=>a.kg)), hi = Math.max(...pts.map(p=>p.kg), ...avgs.map(a=>a.kg));
  lo = Math.floor(lo-0.3); hi = Math.ceil(hi+0.3); if (hi-lo<2) hi = lo+2;
  const x = d => L + (parseYmd(d).getTime()-t0)/span*(W-L-R);
  const y = v => T + (hi-v)/(hi-lo)*(H-T-B);
  const step = Math.max(1, Math.round((hi-lo)/4));
  let g = "";
  for (let v=lo; v<=hi; v+=step) g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+v+'</text>';
  const dots = pts.map(p=>'<circle cx="'+x(p.d).toFixed(1)+'" cy="'+y(p.kg).toFixed(1)+'" r="2.4" fill="var(--muted)" opacity=".55"/>').join("");
  const line = avgs.map((a,i)=>(i?"L":"M")+x(a.d).toFixed(1)+" "+y(a.kg).toFixed(1)).join(" ");
  const area = line+" L"+x(avgs[avgs.length-1].d).toFixed(1)+" "+(H-B)+" L"+x(avgs[0].d).toFixed(1)+" "+(H-B)+" Z";
  const la = avgs[avgs.length-1];
  const lab = '<text x="'+L+'" y="'+(H-6)+'">'+fShort(pts[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+fShort(end)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Courbe du poids et moyenne sur 7 jours">'+g+
    '<path d="'+area+'" fill="var(--accent)" opacity=".10"/>'+dots+'<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+x(la.d)+'" cy="'+y(la.kg)+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'+lab+'</svg>';
}

    if (S.riz.length){
      S.ui.riz = S.ui.riz||{};

      const avg = sum(L.slice(0,5),x=>x.ratio)/Math.min(5,L.length);
      h += '<section class="card"><div class="card-h"><span class="eyebrow">Tes fournées</span><span class="chip acc">ratio moyen '+avg.toFixed(2)+'</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Cru</th><th>Cuit</th><th>Ratio</th><th>Portion cuite</th></tr></thead><tbody>'+

  const L = S.dietHist.slice().sort((a,b)=>(b.date||"")<(a.date||"")?-1:1);

  return h;
}};
function rizCalc(){
  const out = document.getElementById("rz-out"); if (!out) return null;
  const cru = num(val("rz-cru")), brut = num(val("rz-cuit")), tare = num(val("rz-tare"))||0, por = num(val("rz-portion"));
  if (!cru || !brut || brut-tare<=0){ out.innerHTML = '<div class="empty">Entre le poids cru et la pesée après cuisson.</div>'; return null; }
  const cuit = brut-tare, ratio = cuit/cru, pc = por ? por*ratio : null;
  out.innerHTML = '<div class="stat" style="align-items:center;padding:14px"><span class="k">Grammes cuits par portion</span><span class="big num" style="font-size:56px">'+(pc?Math.round(pc):"–")+' g</span></div>'+
    '<div class="grid3"><div class="stat"><span class="k">Riz cuit net</span><span class="v num">'+Math.round(cuit)+' g</span></div><div class="stat"><span class="k">Ratio</span><span class="v num">×'+ratio.toFixed(2)+'</span></div><div class="stat"><span class="k">Portions</span><span class="v num">'+(por?(cru/por).toFixed(1):"–")+'</span></div></div>';
  return {cru, brut, tare, cuit, ratio, portionCrue:por, portionCuite:pc};
}

/* ================= ÉCRITURES ================= */
const queues = {};
function put(path, data){
  if (!S.db) { toast("Base indisponible : rien n'a été enregistré.",true); return Promise.reject(new Error("no db")); }
  const prev = queues[path] || Promise.resolve();
  const p = prev.catch(()=>{}).then(()=>S.db.doc(path).set(data)).catch(e=>{ handleErr(e); throw e; });
  queues[path] = p; return p;
}
function rm(path){
  if (!S.db) return Promise.reject(new Error("no db"));
  const prev = queues[path] || Promise.resolve();
  const p = prev.catch(()=>{}).then(()=>S.db.doc(path).delete()).catch(e=>{ handleErr(e); throw e; });
  queues[path] = p; return p;
}
function handleErr(e){
  const c = e && e.code;
  if (c==="quota_exceeded") toast("Base pleine : supprime d'anciennes données ou exporte-les.",true);
  else if (c==="write_failed") toast("Échec de l'enregistrement. Vérifie ta connexion et réessaie.",true);
  else toast("Échec de l'enregistrement. Vérifie ta connexion et réessaie.",true);
}
function editDay(i, fn){
  const mon = S.ui.ecoleWeek; const W = JSON.parse(JSON.stringify(weekDoc(mon))); W.jours = W.jours||{};
  const j = W.jours[String(i)] = W.jours[String(i)] || {}; fn(j); W.lundi = mon;
  return put("ecole_semaines/"+mon, W);
}

});
document.addEventListener("submit", async e => {
  const f = e.target; const k = f.dataset.form; if (!k) return; e.preventDefault();
  if (document.activeElement) document.activeElement.blur();
  try {
    if (k==="sheet"){ const s = S.sheet; await SHEETS[s.type].save(s.ds); if (S.sheet===s && !document.querySelector(".toast.err")) closeSheet(); return; }
    if (k==="poids"){ const inp = f.querySelector("input"); const v = num(inp.value); if (v==null || v<30 || v>250) return toast("Entre un poids valide, par ex. 82.4",true);
      await put("poids/"+today(), {date:today(), kg:r1(v)}); toast("Pesée notée : "+kg(v)+" kg"); return; }
    if (k==="tension"){ const sys=num(val("t-sys")), dia=num(val("t-dia")), pul=num(val("t-pul")); if (sys==null||dia==null) return toast("Systolique et diastolique obligatoires.",true);
      await put("tension/"+today(), {date:today(), sys, dia, pul}); toast("Tension notée"); return; }
    if (k==="riz"){ const r = rizCalc(); if (!r) return toast("Entre le poids cru et la pesée cuite.",true);
      await put("riz/"+uid(), {date:today(), ...r});
      const cfg = S.app.config||{}; if (cfg.tareRiz!==r.tare) await put("app/config",{...cfg, tareRiz:r.tare});
      S.ui.riz = {}; toast("Fournée enregistrée : "+Math.round(r.portionCuite||0)+" g cuits par portion"); return; }
  } catch(err){}
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && S.sheet) closeSheet(); });

async function doExport(){
  const out = {exporteLe:new Date().toISOString()};
  Object.keys(Store.rows).sort().forEach(p=>{ const [c, ...rest] = p.split("/"); (out[c]=out[c]||{})[rest.join("/")] = Store.rows[p]; });
  const blob = new Blob([JSON.stringify(out,null,2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "qg-marcello-"+today()+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Export prêt");
}

/* ================= SYNCHRO (Supabase) ================= */
const SB_URL = "https://uzaywupafqbkgupnuege.supabase.co";
const SB_KEY = "sb_publishable_o-WPy3WbBHjzq4tjvN2fEQ_hE4jk1Qb";
const COLS = ["app","poids","mesures","tension","riz","fixes","factures","depenses","mois","agenda","notes","ecole_semaines","diet_historique"];
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"qg-auth"}}) : null;
const Store = { rows:{}, subs:{}, uid:null,
  emit(col){ const docs = Object.keys(this.rows).filter(p=>p.startsWith(col+"/")).map(p=>{ const o=this.rows[p]; return {id:p.slice(col.length+1), exists:true, data:()=>o}; });
    (this.subs[col]||[]).forEach(fn=>fn({docs})); },
  emitAll(){ COLS.forEach(c=>this.emit(c)); },
  async loadAll(){ const {data, error} = await sb.from("docs").select("path,col,data"); if (error) throw error;
    const r = {}; (data||[]).forEach(x=>{ r[x.path]=x.data; }); this.rows = r; this.emitAll(); },
  async set(path, data){ const col = path.split("/")[0]; const prev = this.rows[path]; this.rows[path] = JSON.parse(JSON.stringify(data)); this.emit(col);
    const {error} = await sb.from("docs").upsert({path, col, data, user_id:this.uid}, {onConflict:"path"});
    if (error){ if (prev===undefined) delete this.rows[path]; else this.rows[path]=prev; this.emit(col); throw {code:"write_failed", message:error.message}; } },
  async del(path){ const col = path.split("/")[0]; const prev = this.rows[path]; delete this.rows[path]; this.emit(col);
    const {error} = await sb.from("docs").delete().eq("path", path);
    if (error){ if (prev!==undefined) this.rows[path]=prev; this.emit(col); throw {code:"write_failed", message:error.message}; } },
  live(){ sb.channel("docs-live").on("postgres_changes", {event:"*", schema:"public", table:"docs"}, p => {
      if (p.eventType==="DELETE"){ const path = p.old && p.old.path; if (path && this.rows[path]!==undefined){ delete this.rows[path]; this.emit(path.split("/")[0]); } }
      else if (p.new && p.new.path){ this.rows[p.new.path] = p.new.data; this.emit(p.new.col); }
    }).subscribe(); }
};
const dbAdapter = {
  doc(path){ return { set:d=>Store.set(path,d), delete:()=>Store.del(path) }; },
  collection(c){ return {
    onSnapshot(next){ (Store.subs[c] = Store.subs[c]||[]).push(next); return ()=>{}; },
    async get(){ const docs = Object.keys(Store.rows).filter(p=>p.startsWith(c+"/")).map(p=>({id:p.slice(c.length+1), data:()=>Store.rows[p]})); return {docs}; }
  }; }
};
function sub(col, apply){
  dbAdapter.collection(col).onSnapshot(snap => { apply(snap.docs.map(d=>({id:d.id, ...d.data()}))); S.loaded[col]=true; render(); });
}
const byId = (list) => { const o = {}; list.forEach(x=>{ o[x.id]=x; }); return o; };

/* ---------- connexion ---------- */
function renderLogin(msg, err){
  document.getElementById("ttl").textContent = "QG";
  document.getElementById("sub").textContent = "";
  document.getElementById("tabs").innerHTML = "";
  $app.innerHTML = '<form class="login" data-form="login"><div class="big">QG</div><div class="muted">Connecte-toi pour ouvrir ton app.</div>'+
    (msg?'<div class="'+(err?"banner":"card small")+'">'+esc(msg)+'</div>':'')+
    '<div class="field"><label for="lg-mail">Email</label><input class="inp" id="lg-mail" type="email" autocomplete="username" inputmode="email" required></div>'+
    '<div class="field"><label for="lg-pass">Mot de passe</label><input class="inp" id="lg-pass" type="password" autocomplete="current-password" minlength="8" required></div>'+
    '<button class="btn pri full" type="submit" data-mode="in">Se connecter</button>'+
    '<button class="btn ghost full" type="button" data-act="signup">Première fois : créer mon compte</button></form>';
}
const AUTH_ERR = m => /invalid login/i.test(m) ? "Email ou mot de passe incorrect." : /not confirmed/i.test(m) ? "Confirme d'abord ton email avec le lien reçu, puis reconnecte-toi." : /fermees|database error/i.test(m) ? "Les inscriptions sont fermées : ce QG a déjà son propriétaire." : /password/i.test(m) ? "Mot de passe trop court : 8 caractères minimum." : m;
ACT.signup = async () => {
  const email = val("lg-mail").trim(), password = val("lg-pass");
  if (!email || password.length<8) return renderLogin("Entre ton email et un mot de passe d'au moins 8 caractères, puis touche « créer mon compte ».", true);
  const {data, error} = await sb.auth.signUp({email, password, options:{emailRedirectTo: location.origin+location.pathname}});
  if (error) return renderLogin(AUTH_ERR(error.message), true);
  if (data.session) return start(data.session);
  renderLogin("Compte créé. Ouvre l'email de confirmation, touche le lien, puis reviens ici te connecter.");
};
ACT.logout = async () => { await sb.auth.signOut(); location.reload(); };
document.addEventListener("submit", async e => {
  if (e.target.dataset.form!=="login") return; e.preventDefault();
  const {data, error} = await sb.auth.signInWithPassword({email:val("lg-mail").trim(), password:val("lg-pass")});
  if (error) return renderLogin(AUTH_ERR(error.message), true);
  start(data.session);
}, true);

let started = false;
async function start(session){
  if (started) return; started = true;
  Store.uid = session.user.id; S.db = dbAdapter; S.dbState = "ok"; S.dl = true;
  COLS.forEach(c=>{ const m = {app:"app",poids:"poids",mesures:"mesures",tension:"tension",riz:"riz",fixes:"fixes",factures:"factures",depenses:"depenses",mois:"mois",agenda:"agenda",notes:"notes",ecole_semaines:"semaines",diet_historique:"dietHist"}[c];
    const asMap = ["app","poids","mesures","tension","mois","agenda","ecole_semaines"].includes(c);
    sub(c, L => { S[m] = asMap ? byId(L) : L; }); });
  render();
  try { await Store.loadAll(); } catch(e){ toast("Impossible de charger tes données. Vérifie ta connexion.", true); }
  Store.live();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) Store.loadAll().catch(()=>{}); });
}
async function boot(){
  if (!sb){ $app.innerHTML = '<div class="banner">Impossible de joindre le serveur. Vérifie ta connexion puis recharge.</div>'; return; }
  const {data} = await sb.auth.getSession();
  if (data.session) start(data.session); else renderLogin();
  sb.auth.onAuthStateChange((ev, session) => { if (ev==="SIGNED_OUT"){ started=false; renderLogin(); } });
}
setInterval(()=>{ const t = today(); if (t!==boot._d){ boot._d=t; render(); } }, 60000); boot._d = today();
boot();
})();
